<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login / Register</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<div class="tabs">

<button class="tab active" data-form="loginForm">
Bejelentkezés
</button>

<button class="tab" data-form="registerForm">
Regisztráció
</button>

</div>

<!-- LOGIN -->

<form id="loginForm" class="form active" action="service.php" method="post">

<h2>Bejelentkezés</h2>

<label for="loginEmail">Email</label>
<input type="email" id="loginEmail" placeholder="Email" name="email" autocomplete="email" required>

<div class="password-box">

<label for="loginPassword">Jelszó</label>
<input type="password" id="loginPassword" placeholder="Jelszó" name="password" autocomplete="current-password" required>
<span class="eye">👁️</span>

</div>

<button type="submit">Belépés</button>

<p class="forgot" id="forgotPassword">Elfelejtett jelszó?</p>

</form>

<!-- REGISTER -->

<form id="registerForm" class="form">

<h2>Regisztráció</h2>

<label for="regName">Felhasználónév</label>
<input type="text" id="regName" placeholder="Felhasználónév" autocomplete="username" required>

<label for="regEmail">Email</label>
<input type="email" id="regEmail" placeholder="Email" autocomplete="email" required>

<div class="password-box">

<label for="regPassword">Jelszó</label>
<input type="password" id="regPassword" placeholder="Jelszó" autocomplete="new-password" required>
<span class="eye">👁️</span>

</div>

<div id="passwordError"></div>

<div class="password-box">

<label for="regPassword2">Jelszó újra</label>
<input type="password" id="regPassword2" placeholder="Jelszó újra" autocomplete="new-password" required>
<span class="eye">👁️</span>

</div>

<!-- NEWSLETTER -->
<label class="terms">

<input type="checkbox" id="newsletter">

Feliratkozom a hírlevélre

</label>

<!-- TERMS -->
<label class="terms">

<input type="checkbox" id="terms">

Elfogadom a felhasználási feltételeket

</label>

<button type="submit">Regisztráció</button>

</form>

<p id="message"></p>

</div>

<script src="script.js"></script>

</body>
</html>
