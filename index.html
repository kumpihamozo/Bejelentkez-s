<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat {
            width: 95%;
            max-width: 800px;
            height: 90vh;
            background: #1e293b;
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2563eb;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            align-self: flex-end;
            max-width: 70%;
            background: #2563eb;
            padding: 12px 16px;
            border-radius: 16px 16px 4px 16px;
            word-break: break-word;
        }

        .time {
            display: block;
            font-size: 10px;
            opacity: 0.6;
            margin-top: 5px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #172033;
        }

        .input-area input {
            flex: 1;
            padding: 14px;
            border: none;
            outline: none;
            border-radius: 12px;
            background: #334155;
            color: white;
            font-size: 16px;
        }

        .input-area input::placeholder {
            color: #94a3b8;
        }

        .input-area button {
            border: none;
            padding: 0 22px;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .input-area button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="chat">

    <div class="header">
        💬 Chat
    </div>

    <div class="messages" id="messages">
        <!-- Ide kerülnek az üzenetek -->
    </div>

    <form class="input-area" id="chatForm">

        <input
            type="text"
            id="messageInput"
            placeholder="Írj egy üzenetet..."
            autocomplete="off"
        >

        <button type="submit">
            Küldés
        </button>

    </form>

</div>

<script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const text = input.value.trim();

        if (text === "") return;

        // Üzenet létrehozása
        const message = document.createElement("div");
        message.className = "message";

        const time = new Date().toLocaleTimeString("hu-HU", {
            hour: "2-digit",
            minute: "2-digit"
        });

        message.innerHTML = `
            ${escapeHTML(text)}
            <span class="time">${time}</span>
        `;

        // Üzenet hozzáadása a chathez
        messages.appendChild(message);

        // Input törlése
        input.value = "";

        // Automatikus görgetés
        messages.scrollTop = messages.scrollHeight;
    });

    // Biztonságos szövegmegjelenítés
    function escapeHTML(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
